<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotation tool demo</title>
  <style>
    :root {
      --color-white: #ffffff;
      --color-gray-100: #f5f5f5;
      --color-gray-500: #737373;
      --color-gray-950: #0a0a0a;

      --bg: var(--color-white);
      --ink: var(--color-gray-950);
      --muted: var(--color-gray-500);
      --chip: var(--color-gray-100);
      --lift: inset 0 0 0 1px #f2f2f2, 0 1px 2px rgba(0,0,0,.03), 0 10px 28px -16px rgba(0,0,0,.14);
      --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --r-card: 14px;
      --r-control: 8px;
      --space-2: 8px;
      --space-4: 16px;
      --space-6: 24px;
      --space-12: 48px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: var(--space-12) var(--space-4); background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 var(--space-2); font-size: 32px; font-weight: 500; letter-spacing: -.02em; }
    .lead { margin: 0 0 var(--space-6); color: var(--muted); }
    .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); }
    .plan { padding: var(--space-6); border-radius: var(--r-card); box-shadow: var(--lift); }
    .plan h2 { margin: 0; font-size: 15px; font-weight: 500; }
    .price { margin: var(--space-2) 0 var(--space-4); font: 13px/1.4 var(--mono); color: var(--muted); }
    .cta { padding: var(--space-2) var(--space-4); border: 0; border-radius: var(--r-control); background: var(--ink); color: var(--bg); font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Pick your plan</h1>
    <p class="lead">Press Option+Shift+C and point at anything on this page.</p>
    <section class="plans">
      <article class="plan">
        <h2>Starter</h2>
        <p class="price">$0 / month</p>
        <button class="cta">Start free</button>
      </article>
      <article class="plan">
        <h2>Studio</h2>
        <p class="price">$12 / month</p>
        <button class="cta">Try Studio</button>
      </article>
    </section>
  </main>
  <script src="../annotation-tool.js"></script>
</body>
</html>
